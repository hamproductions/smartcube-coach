<!doctype html>
<!-- Park UI resolves its semantic colour tokens against a `.dark` ancestor. This
     app has always been dark-only (see docs/design-system.md), so without this a
     migrated component renders light-on-light against the unmigrated dark chrome. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d0b" />
    <meta name="description" content="Local-first smart cube capture, reconstruction and training coach" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <title>Smart Cube Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
